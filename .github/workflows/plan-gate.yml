name: Plan gate
on:
  issues:
    types:
      - assigned
jobs:
  plan-not-approved:
    # Assigning Copilot also assigns the human who started the task, so every assignment
    # fires two `assigned` events. Only gate the Copilot one (login confirmed in the
    # "Show assignee" step of runs #7/#8: `Copilot` and `sheriffMoose`).
    if: ${{ github.event.assignee.login == 'Copilot' && !contains(github.event.issue.labels.*.name, 'plan-approved') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Show assignee (for the Copilot login check)
        run: echo "assignee=${{ github.event.assignee.login }}"
      - name: Comment
        run: gh issue comment "$NUMBER" --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: plan not approved - merge the plan PR and add the plan-approved label first