<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Planning vs execution: two agents, two tool belts</text>

  <!-- phase labels -->
  <text x="140" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">PLANNING</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">APPROVAL GATE</text>
  <text x="820" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">EXECUTION → VALIDATION</text>

  <!-- planner -->
  <rect x="30" y="84" width="220" height="190" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">planner.agent.md</text>
  <text x="140" y="134" text-anchor="middle" font-size="12" fill="#4c1d95">tools: ["read", "search"]</text>
  <rect x="52" y="150" width="80" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="92" y="169" text-anchor="middle" font-size="13" fill="#14532d">✓ read</text>
  <rect x="148" y="150" width="80" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="188" y="169" text-anchor="middle" font-size="13" fill="#14532d">✓ search</text>
  <rect x="52" y="190" width="80" height="28" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="92" y="209" text-anchor="middle" font-size="13" fill="#7f1d1d">✗ edit</text>
  <rect x="148" y="190" width="80" height="28" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="188" y="209" text-anchor="middle" font-size="13" fill="#7f1d1d">✗ execute</text>
  <text x="140" y="246" text-anchor="middle" font-size="12" fill="#4c1d95">no edit tool → can't write files</text>

  <!-- plan doc -->
  <line x1="250" y1="180" x2="300" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="302" y="96" width="120" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="362" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Plan</text>
  <g font-size="11.5" fill="#334155">
    <text x="314" y="142">1 Goal</text><text x="314" y="162">2 Files to change</text><text x="314" y="182">3 Steps</text>
    <text x="314" y="202">4 Tests to add</text><text x="314" y="222">5 Risks</text><text x="314" y="242">6 Out of scope</text>
  </g>

  <!-- gate -->
  <line x1="422" y1="180" x2="452" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="508,130 560,180 508,230 456,180" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="508" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">Human</text>
  <text x="508" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">approves</text>
  <text x="508" y="256" text-anchor="middle" font-size="11.5" fill="#78350f">explicit handoff</text>

  <!-- implementer -->
  <line x1="560" y1="180" x2="596" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="598" y="84" width="200" height="190" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="698" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">implementer.agent.md</text>
  <text x="698" y="134" text-anchor="middle" font-size="12" fill="#064e3b">tools: ["read","edit","execute"]</text>
  <rect x="618" y="150" width="76" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="656" y="169" text-anchor="middle" font-size="13" fill="#14532d">✓ read</text>
  <rect x="704" y="150" width="76" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="742" y="169" text-anchor="middle" font-size="13" fill="#14532d">✓ edit</text>
  <rect x="618" y="190" width="162" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="699" y="209" text-anchor="middle" font-size="13" fill="#14532d">✓ execute</text>
  <text x="698" y="246" text-anchor="middle" font-size="12" fill="#064e3b">"only the approved plan"</text>

  <!-- validation -->
  <line x1="798" y1="180" x2="828" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="830" y="120" width="110" height="120" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="885" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">PR</text>
  <text x="885" y="172" text-anchor="middle" font-size="11.5" fill="#0c4a6e">commits</text>
  <text x="885" y="192" text-anchor="middle" font-size="11.5" fill="#0c4a6e">CI checks</text>
  <text x="885" y="212" text-anchor="middle" font-size="11.5" fill="#0c4a6e">human review</text>

  <!-- guidance vs enforcement -->
  <rect x="30" y="300" width="440" height="110" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="50" y="328" font-size="15" font-weight="700" fill="#9a3412">Instructions (prompt body) = GUIDANCE</text>
  <text x="50" y="352" font-size="12.5" fill="#7c2d12">"Do not modify any file." — the model is asked.</text>
  <text x="50" y="374" font-size="12.5" fill="#7c2d12">A persuasive enough prompt can argue with it.</text>
  <text x="50" y="396" font-size="12.5" fill="#7c2d12">Controls the plan's shape, not what's possible.</text>

  <rect x="490" y="300" width="450" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="510" y="328" font-size="15" font-weight="700" fill="#1e3a8a">tools allowlist / gates = ENFORCEMENT</text>
  <text x="510" y="352" font-size="12.5" fill="#1e3a8a">No edit tool → editing is impossible, whatever the prompt.</text>
  <text x="510" y="374" font-size="12.5" fill="#1e3a8a">[] = no tools · omitted or ["*"] = all tools</text>
  <text x="510" y="396" font-size="12.5" fill="#1e3a8a">Unknown tool names are silently ignored.</text>
</svg>
