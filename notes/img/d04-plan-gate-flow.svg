<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1f2328">No green light, no code — plan-first flow for txn-screening-svc</text>
  <text x="24" y="54" fill="#57606a">Learn "Option A: plan-first PR": human validation happens before any code is written</text>

  <!-- row 1 -->
  <g>
    <rect x="24" y="84" width="150" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="99" y="112" text-anchor="middle" font-weight="600" fill="#1f2328">Issue</text>
    <text x="99" y="132" text-anchor="middle" fill="#57606a">Agent task form</text>

    <rect x="214" y="84" width="170" height="70" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="299" y="108" text-anchor="middle" font-weight="600" fill="#1f2328">planner</text>
    <text x="299" y="126" text-anchor="middle" fill="#0969da">tools: read, search</text>
    <text x="299" y="143" text-anchor="middle" fill="#57606a">can't write a file</text>

    <rect x="424" y="84" width="180" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="514" y="108" text-anchor="middle" font-weight="600" fill="#1f2328">You copy the plan</text>
    <text x="514" y="126" text-anchor="middle" fill="#57606a">plans/&lt;issue&gt;.md</text>
    <text x="514" y="143" text-anchor="middle" fill="#57606a">PR = plan only, no code</text>

    <rect x="644" y="84" width="180" height="70" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="734" y="108" text-anchor="middle" font-weight="600" fill="#1f2328">Review vs checklist</text>
    <text x="734" y="126" text-anchor="middle" fill="#57606a">notes/plan-checklist.md</text>
    <text x="734" y="143" text-anchor="middle" fill="#57606a">~3 min per plan</text>

    <line x1="174" y1="119" x2="210" y2="119" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <line x1="384" y1="119" x2="420" y2="119" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <line x1="604" y1="119" x2="640" y2="119" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- approve branch -->
  <path d="M734,154 L734,190 L560,190 L560,214" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
  <text x="640" y="183" fill="#1a7f37" font-weight="600">pass</text>
  <rect x="440" y="218" width="240" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="560" y="243" text-anchor="middle" font-weight="600" fill="#1f2328">Approve + merge plan PR</text>
  <text x="560" y="263" text-anchor="middle" fill="#1a7f37">then add label  plan-approved</text>
  <line x1="440" y1="250" x2="384" y2="250" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
  <rect x="164" y="218" width="216" height="64" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="272" y="243" text-anchor="middle" font-weight="600" fill="#1f2328">Only now: assign implementer</text>
  <text x="272" y="263" text-anchor="middle" fill="#0969da">tools: read, edit, execute</text>

  <!-- reject branch -->
  <path d="M824,119 L880,119 L880,214" fill="none" stroke="#cf222e" stroke-width="2" marker-end="url(#r)"/>
  <text x="840" y="110" fill="#cf222e" font-weight="600">fail</text>
  <rect x="740" y="218" width="200" height="64" rx="8" fill="#ffebe9" stroke="#ff8182"/>
  <text x="840" y="240" text-anchor="middle" font-weight="600" fill="#1f2328">Request changes</text>
  <text x="840" y="258" text-anchor="middle" fill="#cf222e">closed unmerged · marked REJECTED</text>
  <text x="840" y="274" text-anchor="middle" fill="#cf222e">implementer never assigned</text>

  <!-- enforcement legend -->
  <rect x="24" y="314" width="912" height="132" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="340" font-weight="600" fill="#1f2328">Where each guarantee actually comes from</text>
  <circle cx="52" cy="364" r="6" fill="#1a7f37"/>
  <text x="66" y="368" fill="#1f2328"><tspan font-weight="600">Enforcement</tspan> — planner's tool list (can't edit) · required review + required status check on main · CODEOWNERS on /infra/ and /.github/workflows/</text>
  <circle cx="52" cy="390" r="6" fill="#d4a72c"/>
  <text x="66" y="394" fill="#1f2328"><tspan font-weight="600">Signal</tspan> — plan-gate.yml on <tspan font-family="Consolas, monospace">issues: assigned</tspan> posts "plan not approved" — Mission 6 tests whether that is a lock</text>
  <circle cx="52" cy="416" r="6" fill="#cf222e"/>
  <text x="66" y="420" fill="#1f2328"><tspan font-weight="600">Guidance</tspan> — "only implement the approved plan", "never touch infra/" in the implementer's prompt</text>
</svg>
