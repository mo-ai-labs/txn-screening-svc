[project]
name = "txn-screening-svc"
version = "0.1.0"
description = "Toy transaction-screening service (synthetic data only) used as a proving ground for GH-600."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
